<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | نظام حضور الطلاب</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#102a43,#176b87);min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px #0003}
header{background:#123b63;color:#fff;text-align:center;padding:24px 16px}header .icon{font-size:42px}header h1{font-size:22px;margin:8px 0}header p{margin:0;font-size:14px}
main{padding:24px}h2{text-align:center;color:#123b63}label{display:block;margin:14px 0 6px;font-weight:bold}input,select{width:100%;padding:12px;border:1px solid #ccd5df;border-radius:8px;font-size:15px}button,.btn{display:block;width:100%;border:0;border-radius:8px;padding:13px;margin-top:20px;background:#176b45;color:#fff;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}button:hover,.btn:hover{background:#105236}.note{text-align:center;color:#777;font-size:12px;margin-top:14px}footer{text-align:center;background:#f2f5f9;color:#123b63;padding:14px;font-size:13px}
</style>
</head>
<body>
<div class="card">
<header><div class="icon">🎓</div><h1>نظام إدارة حضور الطلاب</h1><p>كلية الإمارات للعلوم والتكنولوجيا</p></header>
<main>
<h2>تسجيل الدخول</h2>
<form action="attendance.html" method="get">
<label for="username">اسم المستخدم</label><input id="username" name="username" type="text" placeholder="أدخل اسم المستخدم" required>
<label for="password">كلمة المرور</label><input id="password" name="password" type="password" placeholder="أدخل كلمة المرور" required>
<label for="role">نوع المستخدم</label><select id="role" name="role" required><option value="">اختاري نوع المستخدم</option><option>مدير النظام</option><option>طالب</option><option>ليدر الدفعة</option></select>
<button type="submit">دخول</button>
</form>
<p class="note">واجهة تجريبية فقط، ولا تتحقق من كلمة المرور فعلياً.</p>
</main>
<footer>إعداد الطالبة: سحر كمال الدين الضو الهادي</footer>
</div>
</body>
</html>
