<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجلات الحضور</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#263238}header{background:#123b63;color:white;text-align:center;padding:22px}main{width:95%;max-width:1100px;margin:25px auto}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 4px 14px #0001;overflow-x:auto}h2{color:#123b63}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px;border:1px solid #dbe2ea;text-align:right}th{background:#e7eef5;color:#123b63}button,a{display:inline-block;padding:10px 15px;border:0;border-radius:7px;background:#176b45;color:white;text-decoration:none;cursor:pointer;margin:5px 3px}button.delete{background:#a83232}.empty{padding:20px;color:#777;text-align:center}
</style>
</head>
<body><header><h1>سجلات حضور الطلاب</h1><div>كلية الإمارات للعلوم والتكنولوجيا</div></header>
<main><section class="card"><h2>قائمة السجلات</h2>
<a href="attendance.html">إضافة سجل حضور</a><button onclick="downloadCSV()">تنزيل السجلات CSV</button><button class="delete" onclick="clearRecords()">حذف كل السجلات</button>
<div id="tableWrap"></div>
</section></main>
<script>
function getRecords(){return JSON.parse(localStorage.getItem('attendanceRecords')||'[]')}
function render(){
 const records=getRecords(), wrap=document.getElementById('tableWrap');
 if(!records.length){wrap.innerHTML='<div class="empty">لا توجد سجلات حضور محفوظة في هذا المتصفح حتى الآن.</div>';return}
 let html='<table><thead><tr><th>#</th><th>اسم الطالب</th><th>الرقم الجامعي</th><th>القسم</th><th>التاريخ</th><th>الحالة</th><th>ملاحظات</th></tr></thead><tbody>';
 records.forEach((r,i)=>{html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.studentName)+'</td><td>'+esc(r.studentId)+'</td><td>'+esc(r.department)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.notes||'—')+'</td></tr>'});
 wrap.innerHTML=html+'</tbody></table>';
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clearRecords(){if(confirm('متأكدة من حذف جميع السجلات؟')){localStorage.removeItem('attendanceRecords');render()}}
function downloadCSV(){
 const rows=getRecords();if(!rows.length){alert('لا توجد سجلات لتنزيلها');return}
 const header=['اسم الطالب','الرقم الجامعي','القسم','التاريخ','حالة الحضور','ملاحظات'];
 const lines=[header,...rows.map(r=>[r.studentName,r.studentId,r.department,r.date,r.status,r.notes||''])].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
 const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='attendance-records.csv';a.click();URL.revokeObjectURL(url);
}
render();
</script></body></html>
